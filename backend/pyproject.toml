[project]
name = "aqua-trend-backend"
version = "1.0.0"
description = "Earth System Trend Detective analysis backend"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0", "scipy>=1.13", "fastapi>=0.110", "uvicorn[standard]>=0.29",
  "pydantic>=2.6", "httpx>=0.27",
]
[project.optional-dependencies]
dev = ["pytest>=8", "statsmodels>=0.14"]
llm = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aqua_trend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "realdata: uses the prepared NASA series in web/public/data",
  "slow: simulation / calibration tests",
]
